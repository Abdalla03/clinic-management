server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Hashed production assets are immutable and can be cached long-term.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The runtime API-URL override must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback: let client-side routing handle every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}